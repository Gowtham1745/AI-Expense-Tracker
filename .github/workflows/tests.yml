name: Validate AI Expense Tracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py config.py database.py expense_service.py analytics.py ai_service.py
      - name: Run unit tests
        run: python -m pytest tests -q
